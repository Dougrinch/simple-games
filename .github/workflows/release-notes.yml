name: Release notes

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release notes
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Validate release notes
        run: npm run release-notes:check
